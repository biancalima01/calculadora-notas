name: CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  delivery:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: pytest

      - name: Preparar pacote
        run: |
          mkdir entrega
          cp calculadora.py entrega/
          cp README.md entrega/
          cp requirements.txt entrega/
          cp -r tests entrega/

      - name: Publicar pacote
        uses: actions/upload-artifact@v7
        with:
          name: calculadora-notas
          path: entrega/